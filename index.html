<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Wi-Fi | Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --text: #2b2d42;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        h2 {
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #7d8597;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 40px;
            color: var(--primary);
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
            margin-left: 5px;
        }

        input, select {
            width: 100%;
            padding: 12px 12px 12px 40px;
            margin-top: 5px;
            border-radius: 12px;
            border: 2px solid #edf2f4;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        }

        .btn-generate {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-generate:hover {
            background: var(--secondary);
        }

        #result-container {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #edf2f4;
            animation: fadeIn 0.5s ease;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        #qrcode img {
            border: 10px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <h2><i class="fas fa-wifi"></i> Wi-Fi Connect</h2>
    <p class="subtitle">Gere um QR Code para seus convidados</p>

    <div class="input-group">
        <label>Nome da Rede (SSID)</label>
        <i class="fas fa-network-wired"></i>
        <input type="text" id="ssid" placeholder="Ex: Minha_Rede_Casa">
    </div>

    <div class="input-group">
        <label>Senha</label>
        <i class="fas fa-lock"></i>
        <input type="password" id="senha" placeholder="Sua senha secreta">
    </div>

    <div class="input-group">
        <label>Segurança</label>
        <i class="fas fa-shield-alt"></i>
        <select id="seguranca">
            <option value="WPA">WPA / WPA2 (Padrão)</option>
            <option value="WEP">WEP (Antigo)</option>
            <option value="nopass">Rede Aberta</option>
        </select>
    </div>

    <button class="btn-generate" onclick="gerar()">
        Gerar QR Code <i class="fas fa-qrcode" style="margin-left: 8px;"></i>
    </button>

    <div id="result-container">
        <div id="qrcode"></div>
        <button class="btn-download" onclick="baixar()">
            <i class="fas fa-download"></i> Baixar Imagem
        </button>
    </div>
</div>

<script>
    function gerar() {
        const ssid = document.getElementById("ssid").value.trim();
        const senha = document.getElementById("senha").value.trim();
        const seguranca = document.getElementById("seguranca").value;

        if (!ssid) {
            alert("Por favor, informe o nome da rede.");
            return;
        }

        const qrTexto = `WIFI:T:${seguranca};S:${ssid};P:${senha};;`;
        const qrDiv = document.getElementById("qrcode");
        qrDiv.innerHTML = "";

        new QRCode(qrDiv, {
            text: qrTexto,
            width: 200,
            height: 200,
            colorDark : "#2b2d42",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // Mostra o container com animação
        document.getElementById("result-container").style.display = "block";
    }

    function baixar() {
        const img = document.querySelector("#qrcode img");
        if (!img) return;

        const link = document.createElement("a");
        link.href = img.src;
        link.download = `wifi-${document.getElementById("ssid").value}.png`;
        link.click();
    }
</script>

</body>
</html>
